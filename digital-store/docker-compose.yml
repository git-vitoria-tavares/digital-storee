services:
  mysql:
    image: mysql:8.4
    container_name: digital-store-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: digitalstore
      MYSQL_DATABASE: digital_store
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdigitalstore"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
